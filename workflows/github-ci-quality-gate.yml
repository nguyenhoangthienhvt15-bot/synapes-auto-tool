name: Synapes Quality & Anti-Fake Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  secret-and-static-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Semgrep Anti-Fake Activity Check
        uses: semgrep/semgrep-action@v1
        with:
          config: .semgrep/no-fake-activity.yml

  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/verify-integrity.cjs
      - run: npx vitest run tests/anti-fake-activity.test.ts
      - run: npm run build
      - name: Install Playwright & Run Anti-Fake E2E
        run: |
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/anti-fake-activity.spec.ts
