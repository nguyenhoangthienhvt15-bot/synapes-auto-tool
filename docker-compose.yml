# Synapes Studio - 100% Cloud Railway / Cloud VPS Deployment Blueprint
# Designed for Zero-Local-RAM offload (runs completely on Railway + Kaggle/RunPod GPU Worker)

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - synapes_cloud

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    ports:
      - "4000:4000"
    networks:
      - synapes_cloud

  swarm-orchestrator:
    build:
      context: ./services/swarm-agent
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      LITELLM_BASE_URL: http://litellm:4000
      REDIS_URL: redis://redis:6379/0
      COMFYUI_WORKER_URL: ${COMFYUI_WORKER_URL:-}
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      litellm:
        condition: service_started
    networks:
      - synapes_cloud

  backend-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${PORT:-10000}
      REDIS_URL: redis://redis:6379/0
      SWARM_AGENT_URL: http://swarm-orchestrator:8000
      LITELLM_GATEWAY_URL: http://litellm:4000
      COMFYUI_WORKER_URL: ${COMFYUI_WORKER_URL:-}
      MASTER_VAULT_KEY: ${MASTER_VAULT_KEY:-}
    ports:
      - "10000:10000"
    depends_on:
      redis:
        condition: service_healthy
      swarm-orchestrator:
        condition: service_started
    networks:
      - synapes_cloud

  frontend-web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://backend-worker:10000
    ports:
      - "4173:80"
    depends_on:
      - backend-worker
    networks:
      - synapes_cloud

networks:
  synapes_cloud:
    driver: bridge
