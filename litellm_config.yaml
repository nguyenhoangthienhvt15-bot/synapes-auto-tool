model_list:
  - model_name: writers-room-architect
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
  - model_name: writers-room-cinematographer
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY
  - model_name: writers-room-critic
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
  - model_name: writers-room-deepseek
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 45
  fallbacks:
    - writers-room-architect: ["writers-room-deepseek", "writers-room-critic"]
    - writers-room-cinematographer: ["writers-room-architect", "writers-room-critic"]

litellm_settings:
  drop_params: true
  request_timeout: 60
