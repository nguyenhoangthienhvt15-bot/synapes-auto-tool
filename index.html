<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>SYNAPES Studio — Nền Tảng Tự Động Hóa Sản Xuất Video</title>
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SYNAPES Auto Tool — Hệ Thống Sản Xuất & Xuất Bản Video Đa Nền Tảng" />

    <!-- Instant System Font Fallback & Zero-FOUT Inline Critical Style -->
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: #FFFFFF;
        color: #09090b;
      }
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #FFFFFF;
      }
      .app-initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .app-initial-spinner {
        width: 28px;
        height: 28px;
        border: 2px solid rgba(0, 0, 0, 0.08);
        border-top-color: #09090b;
        border-radius: 50%;
        animation: app-spin 0.65s linear infinite;
      }
      .app-initial-text {
        font-size: 12px;
        font-weight: 500;
        color: #71717a;
        letter-spacing: -0.01em;
      }
      @keyframes app-spin {
        to { transform: rotate(360deg); }
      }
    </style>

    <!-- Asynchronous High-Performance Typography: Non-blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    >
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
    </noscript>
  </head>
  <body>
    <div id="root">
      <div class="app-initial-loader">
        <div class="app-initial-spinner"></div>
        <div class="app-initial-text">SYNAPES Studio đang kết nối...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
