<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>SYNAPES Studio — Nền Tảng Tự Động Hóa Sản Xuất Video</title>
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SYNAPES Auto Tool — Hệ Thống Sản Xuất & Xuất Bản Video Đa Nền Tảng" />

    <!-- Instant Warm Editorial Font Fallback & Zero-FOUT Inline Critical Style -->
    <style>
      :root {
        font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background-color: #FAF8F4;
        color: #141413;
      }
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #FAF8F4;
      }
      .app-initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        font-family: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
      }
      .app-initial-spinner {
        width: 28px;
        height: 28px;
        border: 2px solid rgba(20, 20, 19, 0.08);
        border-top-color: #141413;
        border-radius: 50%;
        animation: app-spin 0.65s linear infinite;
      }
      .app-initial-text {
        font-size: 12px;
        font-weight: 500;
        color: #5E5D59;
        letter-spacing: -0.01em;
      }
      @keyframes app-spin {
        to { transform: rotate(360deg); }
      }
    </style>

    <!-- Preload Synapes Harmonic Forge reveal assets before React hydration -->
    <link rel="preload" href="/synapes-harmonic-forge.json" as="fetch" crossorigin="anonymous" />

    <!-- High-Craft Vietnamese Typography (preconnect during intro; stylesheet attached post-intro) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
    </noscript>
  </head>
  <body>
    <div id="root">
      <div class="app-initial-loader">
        <div class="app-initial-spinner"></div>
        <div class="app-initial-text">SYNAPES Studio đang kết nối...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
